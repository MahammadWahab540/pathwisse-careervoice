name: Verify

on:
  push:
    branches:
      - feat/qalam-adaptive-tool-ui
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract tests
        run: npm test
      - name: TypeScript verification
        run: npm run lint
      - name: Production build
        run: npm run build
